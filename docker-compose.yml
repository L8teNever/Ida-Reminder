services:
  ida-reminder-mcp:
    image: ghcr.io/${GITHUB_OWNER:-l8tenever}/ida-reminder:${IMAGE_TAG:-latest}
    container_name: ida-reminder-mcp
    restart: unless-stopped

    # Bind-IP wie bei den anderen Ida-*-Containern auf diesem Server: NICHT
    # 127.0.0.1, sondern die Docker-Netzwerk-Gateway-IP, ueber die der
    # separat laufende cloudflared-Tunnel-Container diesen Service erreicht.
    # Absicherung nach aussen zusaetzlich per Token direkt in der Anwendung.
    ports:
      - "10.7.0.1:${MCP_PORT:-8031}:8031"

    # env_file gibt dem Container ALLE Variablen aus der .env mit -- vor
    # allem die REMINDER_SLOT_<N>_ROUTINE_ID/_API_KEY-Paare, deren Anzahl
    # dynamisch ist (siehe app/config.py). Dadurch muss diese Datei nie
    # angefasst werden, egal ob 1 oder 30 Plaetze konfiguriert sind.
    env_file:
      - .env

    # environment ueberschreibt bei Namensgleichheit gezielt einzelne Werte
    # aus env_file -- hier fuer die Pflichtpruefung (MCP_AUTH_TOKEN) und die
    # container-internen Fixwerte (MCP_HOST/_PORT immer intern gleich, egal
    # welchen Host-Port .env fuer die linke Seite von ports: waehlt).
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Bitte MCP_AUTH_TOKEN in .env setzen}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8031
      STATE_PATH: /data/state.json

    # /data ist trotz read-only Rootfs beschreibbar (eigenes Volume) --
    # dort liegt state.json, damit geplante Erinnerungen einen
    # Container-Neustart ueberleben.
    volumes:
      - ida-reminder-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8031/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ida-reminder-data:
