services:
  ida-reminder-mcp:
    image: ghcr.io/${GITHUB_OWNER:-l8tenever}/ida-reminder:${IMAGE_TAG:-latest}
    container_name: ida-reminder-mcp
    restart: unless-stopped

    # Bind-IP wie bei den anderen Ida-*-Containern auf diesem Server: NICHT
    # 127.0.0.1, sondern die Docker-Netzwerk-Gateway-IP, ueber die der
    # separat laufende cloudflared-Tunnel-Container diesen Service erreicht.
    # Absicherung nach aussen zusaetzlich per Token direkt in der Anwendung.
    ports:
      - "10.7.0.1:${MCP_PORT:-8030}:8030"

    environment:
      MAX_SLOTS: ${MAX_SLOTS:-10}
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      VORLAUF_MINUTEN: ${VORLAUF_MINUTEN:-5}
      POLL_INTERVALL_SEKUNDEN: ${POLL_INTERVALL_SEKUNDEN:-20}
      STATE_PATH: /data/state.json
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Bitte MCP_AUTH_TOKEN in .env setzen}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8030

      REMINDER_SLOT_1_ROUTINE_ID: ${REMINDER_SLOT_1_ROUTINE_ID:-}
      REMINDER_SLOT_1_API_KEY: ${REMINDER_SLOT_1_API_KEY:-}
      REMINDER_SLOT_2_ROUTINE_ID: ${REMINDER_SLOT_2_ROUTINE_ID:-}
      REMINDER_SLOT_2_API_KEY: ${REMINDER_SLOT_2_API_KEY:-}
      REMINDER_SLOT_3_ROUTINE_ID: ${REMINDER_SLOT_3_ROUTINE_ID:-}
      REMINDER_SLOT_3_API_KEY: ${REMINDER_SLOT_3_API_KEY:-}
      REMINDER_SLOT_4_ROUTINE_ID: ${REMINDER_SLOT_4_ROUTINE_ID:-}
      REMINDER_SLOT_4_API_KEY: ${REMINDER_SLOT_4_API_KEY:-}
      REMINDER_SLOT_5_ROUTINE_ID: ${REMINDER_SLOT_5_ROUTINE_ID:-}
      REMINDER_SLOT_5_API_KEY: ${REMINDER_SLOT_5_API_KEY:-}
      REMINDER_SLOT_6_ROUTINE_ID: ${REMINDER_SLOT_6_ROUTINE_ID:-}
      REMINDER_SLOT_6_API_KEY: ${REMINDER_SLOT_6_API_KEY:-}
      REMINDER_SLOT_7_ROUTINE_ID: ${REMINDER_SLOT_7_ROUTINE_ID:-}
      REMINDER_SLOT_7_API_KEY: ${REMINDER_SLOT_7_API_KEY:-}
      REMINDER_SLOT_8_ROUTINE_ID: ${REMINDER_SLOT_8_ROUTINE_ID:-}
      REMINDER_SLOT_8_API_KEY: ${REMINDER_SLOT_8_API_KEY:-}
      REMINDER_SLOT_9_ROUTINE_ID: ${REMINDER_SLOT_9_ROUTINE_ID:-}
      REMINDER_SLOT_9_API_KEY: ${REMINDER_SLOT_9_API_KEY:-}
      REMINDER_SLOT_10_ROUTINE_ID: ${REMINDER_SLOT_10_ROUTINE_ID:-}
      REMINDER_SLOT_10_API_KEY: ${REMINDER_SLOT_10_API_KEY:-}

    # /data ist trotz read-only Rootfs beschreibbar (eigenes Volume) --
    # dort liegt state.json, damit geplante Erinnerungen einen
    # Container-Neustart ueberleben.
    volumes:
      - ida-reminder-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ida-reminder-data:
